# --- JVM -------------------------------------------------------------------
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# --- Android ---------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 has built-in Kotlin support (default true). The org.jetbrains.kotlin.android
# plugin must not be applied anywhere.
android.builtInKotlin=true
# AGP 9 public DSL interfaces (default true). Do not turn this off: the opt-out
# disappears in AGP 10.
android.newDsl=true

# --- Kotlin ----------------------------------------------------------------
kotlin.code.style=official
kotlin.incremental=true
ksp.useKSP2=true
