# MultiStore CI: build, test, lint and screenshots on every push.
#
# This pipeline is entirely **offline and hermetic**. It touches none of the 9 stores. Verification
# against the real sites is a separate, non-blocking job (the canary).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.welcome=never

jobs:
  build:
    name: Build, test e lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          # Locally the Android Studio JBR is used (there is no system JDK on that machine); here a
          # Temurin of the same major is enough. The bytecode target is 17 in both cases, read from
          # gradle/libs.versions.toml.
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # **The package list is stated instead of inherited, and that is the whole fix.**
          #
          # `setup-android@v3` defaults to `tools platform-tools`, and `tools` — the obsolete SDK
          # Tools bundle — has been removed from Google's repository. The action then runs
          # `sdkmanager tools`, which answers `Warning: Failed to find package 'tools'` and exits 1,
          # so the job dies at setup with nothing of ours having run. It broke between 10/09/2026
          # (green) and 18/09/2026 (red) with no change on our side.
          #
          # Measured rather than assumed, with the SDK this project builds against:
          # `sdkmanager --list` offers `platform-tools` 37.0.1 and **no** bare `tools` entry.
          #
          # `v4` fixes the default and moves to node24, and it is where this will go — but not on
          # the day it is needed: v4.0.2, .3 and .4 were all published within two hours of each
          # other on 17/09/2026, around this same removal, and the moving `v4` tag would pick up
          # whatever lands next. Naming the package here fixes the failure on the version already
          # in use and, more to the point, stops a default we do not control from deciding what CI
          # installs — which is exactly how this broke.
          packages: platform-tools

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Convention plugin
        # If build-logic does not compile, everything else would fail with indirect errors: getting
        # it wrong first gives the right message.
        run: ./gradlew -p build-logic :convention:build

      - name: Regole di dipendenza fra moduli
        # The dependency rules are verified, not merely written down.
        run: ./gradlew checkDependencyRules

      - name: Guardrail (traduzioni, impostazioni, screenshot)
        # These run first and take a few seconds: if a translation is missing there is no point
        # waiting 20 minutes of build to find out.
        run: ./gradlew :guardrails:test

      - name: Build, test, lint
        run: ./gradlew build lint

      - name: Screenshot Roborazzi (chiaro e scuro)
        # **Settled, and it is worth saying which way.** The committed goldens are recorded on
        # macOS/arm64 and compared here on ubuntu/x86-64, and the open question was whether
        # Robolectric's own `android-all` font stack really makes the output host-independent — "in
        # theory it does" not being a verification. It has since run: this step has passed on every
        # green CI run, the last being 10/09/2026.
        #
        # So a failure here is a **regression**, not the platform, and the remedy is to look at the
        # diff artifact below. If widespread, sub-pixel differences ever do appear, the fix is still
        # not to lower the threshold: it is to make ubuntu-latest the single recording platform —
        # `./gradlew recordRoborazziDebug` from a workflow_dispatch job, PNGs committed — and stop
        # recording locally.
        run: ./gradlew verifyRoborazziDebug

      - name: Report dei test
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          retention-days: 7

      - name: Report lint
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*.html'
          retention-days: 7

      - name: Differenze di screenshot
        # When verifyRoborazzi fails, the diff image is the only way to understand *what* changed:
        # without the artifact one is left looking at an exit code.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: '**/build/outputs/roborazzi/**'
          retention-days: 7

      - name: APK di debug
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: multistore-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
