# --- Network / parsing --------------------------------------------------------
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver3-junit5", version.ref = "okhttp" }
okhttp-mockwebserver-junit4 = { group = "com.squareup.okhttp3", name = "mockwebserver3-junit4", version.ref = "okhttp" }
retrofit-core = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
# --- Streaming JSON reading -------------------------------------------------
# The F-Droid index is 57 MB uncompressed. Building its object tree on a phone is a
# guaranteed OOM, and kotlinx.serialization cannot stream the values of a map: it decodes
# from a stream but still materialises the result.
#
# Exactly one Moshi class is used, `JsonReader`, for two things nothing else here can do:
# walking the root object without loading it, and `nextSource()`, which hands over the raw
# bytes of a subtree. Each package is then handled with kotlinx.serialization, which preserves
# numeric literals exactly as written — that matters, because this JSON is re-serialised to
# apply diffs on top of it.
#
# Alternatives weighed: jackson-core (~600 KB, no shared dependency), gson (~280 KB, same
# role). Moshi wins because it sits on okio, which OkHttp already brings.
moshi = { group = "com.squareup.moshi", name = "moshi", version.ref = "moshi" }
cronet-embedded = { group = "org.chromium.net", name = "cronet-embedded", version.ref = "cronet" }

# --- Images -----------------------------------------------------------------
# `coil-core` is explicit rather than transitive through `coil-compose`: `:app` builds the
# singleton ImageLoader and names `ImageLoader`, `DiskCache` and `SingletonImageLoader`, which
# live here. Depending on `coil-compose` in `:app` just to get them would drag in the
# composables too, which are not needed there.
coil-core = { group = "io.coil-kt.coil3", name = "coil", version.ref = "coil" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# --- Installation / security -------------------------------------------------
# apksig has no version of its own: it is part of the Android build tools and follows AGP.
# The newest release on Maven Central is 2.3.0 — from 2016, without the v3 and v3.1 signing
# schemes — while the real versions live on Google Maven. Pinning it to `agp` avoids ending
# up with a ten-year-old signature verifier that compiles perfectly well.
apksig = { group = "com.android.tools.build", name = "apksig", version.ref = "agp" }
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }
bouncycastle = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
tink-android = { group = "com.google.crypto.tink", name = "tink-android", version.ref = "tink" }

