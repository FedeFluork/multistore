# MultiStore — version catalog.
# No module ever declares a dependency version inline in its build.gradle.kts.
# These versions were verified against the real repositories on 2026-08-23.

[versions]
# --- Toolchain -------------------------------------------------------------
# AGP 9.x has *built-in* Kotlin support: the org.jetbrains.kotlin.android plugin must NOT
# be applied (it fails). See build-logic/.
agp = "9.3.1"
# Aligned with the Kotlin embedded in Gradle 9.6 (2.3.21): a newer KGP produces metadata
# that Gradle's own compiler cannot read when build-logic compiles the script plugins.
kotlin = "2.3.21"
# KSP >= 2.3 is REQUIRED: 2.2.10-2.0.2 registers generated sources via kotlin.sourceSets,
# which AGP 9's built-in Kotlin does not allow.
ksp = "2.3.11"
# Bytecode target for the whole project (Kotlin and Java, Android and pure-JVM modules).
# There must be exactly one: KGP fails the build if compileJava and compileKotlin diverge.
jvmTarget = "17"
# compileSdk 37: current AndroidX (Compose BOM 2026.08) requires it.
# targetSdk stays 36: compileSdk decides which APIs are reachable, not runtime behaviour.
compileSdk = "37"
targetSdk = "36"
minSdk = "26"
buildTools = "36.1.0"

# --- AndroidX --------------------------------------------------------------
androidxActivity = "1.13.0"
androidxAppcompat = "1.8.0"
androidxBrowser = "1.10.0"
androidxCore = "1.19.0"
androidxCoreSplashscreen = "1.2.0"
androidxDatastore = "1.2.1"
androidxHilt = "1.4.0"
androidxLifecycle = "2.11.0"
androidxNavigation = "2.9.8"
androidxPaging = "3.5.1"
androidxProfileinstaller = "1.4.1"
androidxRoom = "2.8.4"
androidxStartup = "1.2.0"
androidxWebkit = "1.17.0"
androidxWork = "2.11.2"
composeBom = "2026.08.00"

# --- Libraries ---------------------------------------------------------------
bouncycastle = "1.85.2"
coil = "3.5.0"
cronet = "500.0.2"
hilt = "2.60.1"
jsoup = "1.23.1"
kotlinxCollectionsImmutable = "0.5.1"
kotlinxCoroutines = "1.11.0"
kotlinxDatetime = "0.8.0"
kotlinxSerialization = "1.11.0"
# Moshi is here ONLY for its JsonReader (a pull parser over okio). See the note next to the
# library below: neither its adapters nor its reflection are used.
moshi = "1.15.2"
okhttp = "5.5.0"
protobuf = "4.36.0"
retrofit = "3.0.0"
shizuku = "13.1.5"
tink = "1.23.0"

# --- Test ------------------------------------------------------------------
androidTools = "32.3.1"
androidxTest = "1.7.0"
androidxTestEspresso = "3.7.0"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
junit4 = "4.13.2"
junitBom = "6.1.3"
mockk = "1.14.11"
roborazzi = "1.72.0"
robolectric = "4.16.1"
truth = "1.4.5"
turbine = "1.2.1"

# --- Third-party plugins ------------------------------------------------------
protobufPlugin = "0.10.0"

[libraries]
